org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
android.useAndroidX=true
# The Firebase Android SDKs (pulled in by @react-native-firebase/auth) are compiled with Kotlin 2.4
# metadata, so the Kotlin Gradle plugin has to be at least that new instead of the version Expo pins.
# 2.4.20 is the newest Kotlin that the Expo Kotlin compiler plugins (pika/expo-modules-v2) are built for.
android.kotlinVersion=2.4.20
android.enablePngCrunchInReleaseBuilds=true
android.enableMinifyInReleaseBuilds=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false
EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false
android.builtInKotlin=false
android.newDsl=false
expo.inlineModules.watchedDirectories=[]
org.gradle.tooling.parallel=true
